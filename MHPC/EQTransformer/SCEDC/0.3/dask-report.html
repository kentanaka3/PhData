      {"8d5c183e-9990-49a3-921f-ecb7fe68944f":{"version":"3.7.2","title":"Bokeh Application","roots":[{"type":"object","name":"Tabs","id":"p1514","attributes":{"sizing_mode":"stretch_both","tabs":[{"type":"object","name":"TabPanel","id":"p1505","attributes":{"title":"Summary","child":{"type":"object","name":"Div","id":"p1504","attributes":{"styles":{"type":"map","entries":[["width","100%"],["height","100%"],["max-width","1920px"],["max-height","1080px"],["padding","12px"],["border","1px solid lightgray"],["box-shadow","inset 1px 0 8px 0 lightgray"],["overflow","auto"]]},"text":"\n        &lt;h1&gt; Dask Performance Report &lt;/h1&gt;\n\n        &lt;i&gt; Select different tabs on the top for additional information &lt;/i&gt;\n\n        &lt;h2&gt; Duration: 36hr 9m &lt;/h2&gt;\n        &lt;h2&gt; Tasks Information &lt;/h2&gt;\n        &lt;ul&gt;\n         &lt;li&gt; number of tasks: 1306 &lt;/li&gt;\n         \n&lt;li&gt; compute time: 36hr 9m &lt;/li&gt;\n        &lt;/ul&gt;\n\n        &lt;h2&gt; Scheduler Information &lt;/h2&gt;\n        &lt;ul&gt;\n          &lt;li&gt; Address: inproc://192.168.1.169/53192/1 &lt;/li&gt;\n          &lt;li&gt; Workers: 1 &lt;/li&gt;\n          &lt;li&gt; Threads: 1 &lt;/li&gt;\n          &lt;li&gt; Memory: 36.00 GiB &lt;/li&gt;\n          &lt;li&gt; Dask Version: 2025.3.0 &lt;/li&gt;\n          &lt;li&gt; Dask.Distributed Version: 2025.3.0 &lt;/li&gt;\n        &lt;/ul&gt;\n\n        &lt;h2&gt; Calling Code &lt;/h2&gt;\n        &lt;pre&gt;\n    def run(self) -&gt; None:\n        \"\"\"\n        Run the builder as configured.\n        This function will build and execute the compute graph.\n        \"\"\"\n        # Create a Dask client for the provided cluster spec.\n        # This call does not block; it returns a client object that can submit tasks and collect results from the configured cluster.\n        client = dask.distributed.Client(self.cluster)\n\n        # Central status object that holds cache metadata and descriptors for the current run.\n        # This object is used to register outputs and to coordinate cache writes via CacheHelper.\n        status = Status(self.output_path)\n\n        # Populate status with static global data (stations, groups, velocity)\n        logger.debug(\"Populating status\")\n        self.data.populate_status(status)\n\n        # Call setup() on all modules to register output keys.\n        # This must be done before creating group statuses so modules can read global inputs.\n        # setup() should be light-weight (no heavy computation) and only declare outputs that the module will create during run().\n        for module in (\n            list(self.group_modules.values())\n            + [self.merge_module]\n            + list(self.joint_modules.values())\n        ):\n            logger.debug(f\"Setting up {module.name}\")\n            for param in module.output_keys():\n                status.register_parameter(param, duplicate=True)\n                module.setup(status)\n\n        # Collect citations and version info from data and modules\n        self._write_citations()\n        self._write_versions()\n\n        group_statuses = []\n        groups = self.data.groups()\n\n        # Optionally regroup to limit number of tasks\n        regrouped = self._regroup(groups)\n\n        # Persist the mapping of regrouped-&gt;original groups for inspection\n        self._regrouped_to_df(regrouped).to_csv(\n            self.output_path / \"groups.csv\", index=False\n        )\n\n        # Run group modules for each regrouped unit\n        for group, subgroups in regrouped.items():\n            logger.debug(f\"Setting up group {group}\")\n            group_status = GroupStatus(group, self.output_path)\n            group_status.update(status, deepcopy=False)\n\n            # Provide a `data_func` token which, when evaluated on workers,\n            # will yield an iterator over ObsPy streams for all subgroups in\n            # this regrouped unit. We store a callable (functools.partial) so\n            # that the actual IO is deferred until task execution on workers.\n            group_status.register_parameter(\"data_func\")\n            group_status.set_param(\n                functools.partial(self._get_multigroup, self.data.get_group, subgroups),\n                \"data_func\",\n                None,\n            )\n\n            # Run all per-group modules which will register delayed tasks\n            for module in self.group_modules.values():\n                module.run(group_status)\n\n            group_statuses.append(group_status)\n\n        # Run merge and joint modules\n        self.merge_module.run(status, group_statuses)\n\n        for module in self.joint_modules.values():\n            module.run(status)\n\n            # Trigger computations and write outputs\n        logger.debug(\"Starting computation\")\n        outputs = [status.get_param(out) for out in self.outputs]\n        if self.adaptive_maximum is not None:\n            self.cluster.adapt(minimum=1, maximum=self.adaptive_maximum)\n        # Write a Dask performance report into the output folder. The\n        # context manager will produce an HTML report that helps debugging\n        # task performance and profiling the run.\n        with dask.config.set(delayed_optimize=self._optimize_dask_graph):\n            with dask.distributed.performance_report(\n                self.output_path / \"dask-report.html\"\n            ):\n                outputs = client.compute(outputs, sync=True)\n\n        logger.debug(\"Writing outputs\")\n        for param, output in zip(self.outputs, outputs):\n            for output_format in self.formats:\n                if output_format == \"csv\":\n                    output.to_csv(self.output_path / (param + \".csv\"), index=False)\n                elif output_format == \"parquet\":\n                    output.to_parquet(\n                        self.output_path / (param + \".parquet\"), index=False\n                    )\n                else:\n                    raise NotImplementedError(f\"Unknown format '{output_format}'\")\n\n        &lt;/pre&gt;\n        "}}}},{"type":"object","name":"TabPanel","id":"p1509","attributes":{"title":"Task Stream","child":{"type":"object","name":"Figure","id":"p1141","attributes":{"name":"task_stream","sizing_mode":"stretch_both","x_range":{"type":"object","name":"DataRange1d","id":"p1139","attributes":{"range_padding":0}},"y_range":{"type":"object","name":"DataRange1d","id":"p1140","attributes":{"range_padding":0}},"x_scale":{"type":"object","name":"LinearScale","id":"p1151"},"y_scale":{"type":"object","name":"LinearScale","id":"p1152"},"title":{"type":"object","name":"Title","id":"p1144","attributes":{"text":"Task Stream"}},"renderers":[{"type":"object","name":"GlyphRenderer","id":"p1183","attributes":{"data_source":{"type":"object","name":"ColumnDataSource","id":"p1136","attributes":{"selected":{"type":"object","name":"Selection","id":"p1137","attributes":{"indices":[],"line_indices":[]}},"selection_policy":{"type":"object","name":"UnionRenderers","id":"p1138"},"data":{"type":"map","entries":[["start",[1763358903467.95,1763359618677.017,1763359708519.2078,1763360069971.3315,1763360966052.2822,1763361500790.7454,1763361500864.315,1763361500893.2334,1763361527628.6335,1763361555060.0532,1763361555766.8164,1763361555774.334,1763361555776.6353,1763361555779.2903,1763361571498.129,1763361587309.7434,1763361587405.9604,1763361587409.523,1763361587412.363,1763361587426.875,1763361587441.723,1763361587444.4644,1763361587447.167,1763361600670.795,1763362019556.6357,1763362425222.0776,1763362425225.5845,1763362425273.205,1763362425327.444,1763362465322.3596,1763362505317.2646,1763362505326.623,1763362505333.6902,1763362505340.3005,1763362505466.1946,1763363185003.8538,1763363864425.038,1763363864433.3586,1763363864536.7788,1763363877569.0322,1763364621039.6694,1763365351581.5325,1763365351591.9849,1763365351599.619,1763365351612.929,1763365351650.8748,

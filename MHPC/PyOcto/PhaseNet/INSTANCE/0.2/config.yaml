log_level: DEBUG
output_path: catalogs/OGSPyOcto_TP0.2S0.2
data:
  _target_: ml_catalog.data.SquirrelDataSource
  env: ogsDB
  persistent: v1
  check: false
  paths:
  - /Volumes/Expansion/KEN/waveforms/
  - /Users/admin/Desktop/OGS_Catalog/station/
  channel_priorities:
  - HH?
  - EH?
  - HN?
  - HG?
  - BH?
  starttime: '2024-03-20'
  endtime: '2024-06-20'
  velocity_model:
    _target_: pandas.read_csv
    filepath_or_buffer: OGS/data/VelocityModel.csv
group_modules:
  picker:
    _target_: ml_catalog.modules.SeisBenchPicker
    model:
      _target_: seisbench.models.PhaseNet.from_pretrained
      name: instance
    classify_args:
      P_threshold: 0.1
      S_threshold: 0.1
      batch_size: 16384
    amplitude_extractor:
      _target_: OGS.src.ogspicker.OGSAmplitudeExtractor
  associator:
    _target_: ml_catalog.modules.PyOctoAssociator.from_area
    config:
      lat:
      - 44.3
      - 47.5
      lon:
      - 9.5
      - 15.0
      zlim:
      - 0.0
      - 40.0
      time_before: 300.0
      n_picks: 6
      n_p_picks: 3
      n_s_picks: 3
      n_p_and_s_picks: 3
      pick_match_tolerance: 1.5
      location_split_depth: 7
      location_split_return: 5
      velocity_model:
        _target_: ml_catalog.modules.DynamicPyOctoVelocityModel1D
        delta: 0.5
        xdist: 800.0
        zdist: 50.0
        tolerance: 1.5
  qcpicks:
    _target_: OGS.src.ogsqc.OGSPickStatQC
    total_picks: 6
    p_and_s_picks: 3
  nonlinloc:
    _target_: ml_catalog.modules.NonLinLoc
    _convert_: partial
    CONTROL:
    - 1
    - 42
    TRANS:
    - TRANS_MERC
    - WGS-84
    - 44.3
    - 9.5
    - 0.0
    VGTYPE:
    - - P
    - - S
    VGGRID:
    - 2
    - 9000
    - 550
    - 0.0
    - 0.0
    - -5.0
    - 0.1
    - 0.1
    - 0.1
    - SLOW_LEN
    GTMODE:
    - GRID2D
    - ANGLES_YES
    GT_PLFD:
    - 0.001
    - 0
    LOCSIG:
    - ML Catalog
    LOCHYPOUT:
    - SAVE_NLLOC_ALL
    - SAVE_HYPOINV_SUM
    LOCSEARCH:
    - OCT
    - 50
    - 50
    - 5
    - 0.01
    - 50000
    - 5000
    - 1
    - 1
    LOCGRID:
    - 600
    - 450
    - 50
    - 0
    - 0
    - 0
    - 1
    - 1
    - 1
    - PROB_DENSITY
    - SAVE
    LOCMETH:
    - EDT_OT_WT
    - 9999.0
    - 4
    - -1
    - -1
    - -1
    - 10
    - -1.0
    - 1
    LOCGAU:
    - 0.15
    - 1.0
    LOCGAU2:
    - 0.05
    - 0.1
    - 3.0
    LOCQUAL2ERR:
    - 0.1
    - 0.5
    - 1.0
    - 2.0
    - 99999.9
  magnitude:
    _target_: OGS.src.ogsmagnitude.OGSLocalMagnitude
    station_corrections:
      _target_: pandas.read_csv
      filepath_or_buffer: OGS/data/MagnitudeEstimation/LocalMagnitude/MagnitudeCorrection.csv
    ignore_stations:
      _target_: pandas.read_csv
      filepath_or_buffer: OGS/data/MagnitudeEstimation/LocalMagnitude/IGNORE_STATIONS.csv
merge_module:
  _target_: ml_catalog.base.MergeEvents
joint_modules: {}
builder:
  outputs:
  - events
  - assignments
cluster:
  _target_: dask.distributed.LocalCluster
  n_workers: 1
  threads_per_worker: 1
  processes: false
  dashboard_address: :8989
libpath: .

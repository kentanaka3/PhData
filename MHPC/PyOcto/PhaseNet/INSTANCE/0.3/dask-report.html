es.values())\n        ):\n            logger.debug(f\"Setting up {module.name}\")\n            for param in module.output_keys():\n                status.register_parameter(param, duplicate=True)\n                module.setup(status)\n\n        self._write_citations()\n        self._write_versions()\n\n        group_statuses = []\n        groups = self.data.groups()\n\n        regrouped = self._regroup(groups)\n\n        self._regrouped_to_df(regrouped).to_csv(\n            self.output_path / \"groups.csv\", index=False\n        )\n\n        for group, subgroups in regrouped.items():\n            logger.debug(f\"Setting up group {group}\")\n            group_status = GroupStatus(group, self.output_path)\n            group_status.update(status, deepcopy=False)\n\n            group_status.register_parameter(\"data_func\")\n            group_status.set_param(\n                functools.partial(self._get_multigroup, self.data.get_group, subgroups),\n                \"data_func\",\n                None,\n            )\n\n            for module in self.group_modules.values():\n                module.run(group_status)\n\n            group_statuses.append(group_status)\n\n        self.merge_module.run(status, group_statuses)\n\n        for module in self.joint_modules.values():\n            module.run(status)\n\n        # Trigger computations and write outputs\n        logger.debug(\"Starting computation\")\n        outputs = [status.get_param(out) for out in self.outputs]\n        if self.adaptive_maximum is not None:\n            self.cluster.adapt(minimum=1, maximum=self.adaptive_maximum)\n\n        with dask.config.set(delayed_optimize=self._optimize_dask_graph):\n            with dask.distributed.performance_report(\n                self.output_path / \"dask-report.html\"\n            ):\n                outputs = client.compute(outputs, sync=True)\n\n        logger.debug(\"Writing outputs\")\n        for param, output in zip(self.outputs, outputs):\n            for output_format in self.formats:\n                if output_format == \"csv\":\n                    output.to_csv(self.output_path / (param + \".csv\"), index=False)\n                elif output_format == \"parquet\":\n                    output.to_parquet(\n                        self.output_path / (param + \".parquet\"), index=False\n                    )\n                else:\n                    raise NotImplementedError(f\"Unknown format '{output_format}'\")\n\n        &lt;/pre&gt;\n        "}}}},{"type":"object","name":"TabPanel","id":"p1509","attributes":{"title":"Task Stream","child":{"type":"object","name":"Figure","id":"p1141","attributes":{"name":"task_stream","sizing_mode":"stretch_both","x_range":{"type":"object","name":"DataRange1d","id":"p1139","attributes":{"range_padding":0}},"y_range":{"type":"object","name":"DataRange1d","id":"p1140","attributes":{"range_padding":0}},"x_scale":{"type":"object","name":"LinearScale","id":"p1151"},"y_scale":{"type":"object","name":"LinearScale","id":"p1152"},"title":{"type":"object","name":"Title","id":"p1144","attributes":{"text":"Task Stream"}},"renderers":[{"type":"object","name":"GlyphRenderer","id":"p1183","attributes":{"data_source":{"type":"object","name":"ColumnDataSource","id":"p1136","attributes":{"selected":{"type":"object","name":"Selection","id":"p1137","attributes":{"indices":[],"line_indices":[]}},"selection_policy":{"type":"object","name":"UnionRenderers","id":"p1138"},"data":{"type":"map","entries":[["start",[1762358293531.2405,1762358394539.1313,1762358495665.3535,1762358495970.1252,1762358496126.957,1762358496129.3315,1762358496133.2173,1762358496136.3284,1762358496139.343,1762358496141.078,1762358496142.8616,1762358496146.364,1762358518734.2925,1762358541320.992,1762358541323.3716,1762358541325.2598,1762358541327.9285,1762358541342.0457,1762358559064.4883,1762358576779.7996,1762358576783.0762,1762358576785.4207,1762358576788.0415,1762358576801.4065,1762358577008.388,1762358577204.105,1762358577206.3
